[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "humath"
version = "1.0.2"
authors = [
  { name="Silas Rose", email="silasmrose@gmail.com" },
]
description = "A dependency-free Python math library focusing on high precision and listening to what the community actually wants."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
]
dependencies = [
    #none
]

[project.urls]
Repository = "https://github.com/SiSciGuy12/Humath"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
humath = ["py.typed"]
